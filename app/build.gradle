plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

apply from: '../signing.gradle'

def appProperties = new Properties()
appProperties.load(new FileInputStream(rootProject.file("tvhclient.properties")))

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 241
        versionName "2.4.8-free"

        applicationId "org.tvheadend.tvhclientng"
        setProperty("archivesBaseName", "${applicationId}-${versionName}-${versionCode}")

        buildConfigField "String", "DEVELOPER_EMAIL", "\"${appProperties['developerEmail']}\""
        buildConfigField "Integer", "BUILD_VERSION", "$versionCode"

        def gitSha = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
        def buildTime = new GregorianCalendar().format("yyyy.MM.dd HH:mm:ss")
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""

        buildConfigField "String", "CAST_ID", "\"${appProperties['castId']}\""

        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

        lintOptions {
            checkReleaseBuilds false
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding = true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility = rootProject.ext.javaCompatibility
        targetCompatibility = rootProject.ext.javaCompatibility
    }

    kotlinOptions.jvmTarget = rootProject.ext.javaCompatibility.toString()
    testOptions.unitTests.includeAndroidResources = true
    namespace 'org.tvheadend.tvhclientng'

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "Boolean", "OVERRIDE_UNLOCKED", "false"
        }
        debug {
            initWith buildTypes.release
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    def fragmentVersion = '1.8.6'
    def lifecycleVersion = '2.8.7'
    def materialDialogsVersion = '3.3.0'
    def media3Version = '1.6.1'

    // AndroidX libraries
    implementation "androidx.core:core-ktx:$coreKtxVersion"
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation "androidx.preference:preference-ktx:$prefKtxVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"
    kapt "androidx.lifecycle:lifecycle-common-java8:$lifecycleVersion"
    implementation "androidx.fragment:fragment-ktx:$fragmentVersion"
    debugImplementation "androidx.fragment:fragment-testing:$fragmentVersion"

    // UI & utilities
    implementation 'com.google.android.material:material:1.12.0'
    implementation "com.jakewharton.timber:timber:$timberVersion"
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Chromecast support
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Material navigation drawer and dialogs
    implementation "com.afollestad.material-dialogs:core:$materialDialogsVersion"
    implementation "com.afollestad.material-dialogs:input:$materialDialogsVersion"
    implementation "com.afollestad.material-dialogs:files:$materialDialogsVersion"
    implementation "com.afollestad.material-dialogs:datetime:$materialDialogsVersion"
    implementation "com.afollestad.material-dialogs:lifecycle:${materialDialogsVersion}"
    implementation 'com.mikepenz:materialdrawer:7.0.0'

    // Dependency injection
    implementation "com.google.dagger:dagger:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"

    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX Media3
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-extractor:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"

    implementation project(':htsp')
    implementation project(':data')

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.6.1"
}
