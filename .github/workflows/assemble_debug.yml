name: Build Debug APK

on:
  # Run automatically on every push to develop
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up properties files
        run: |
          mv keystore-github.properties keystore.properties
          mv tvhclient-github.properties tvhclient.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: TVHClientNG-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
